# ============================================================
# BRD-AI: PCB制程能力数据库 (DFM Capability)
# 来源: 四会制程能力初步评估 (02-10)
#   - 硬板-关于四会制程能力初步评估-02-10.xlsx
#   - 软板-关于四会制程能力初步评估-02-10.xlsx
# 单位约定: 每项均带 unit 字段 (mm/um/mil/percent/ratio)
# ============================================================

meta:
  factory: "四会"
  revision: "2026-02-10"
  source_files:
    - "硬板-关于四会制程能力初步评估-02-10.xlsx"
    - "软板-关于四会制程能力初步评估-02-10.xlsx"
  unit_note: "mil->mm 换算 1mil=0.0254mm; 铜厚表中 T 为成品铜厚(um); L/S表为单值表示线宽=线距"

board_types:

  # ==========================================================
  # 硬板 (Rigid)
  # ==========================================================
  rigid:
    label: "硬板"
    levels: [standard, automotive, extreme]
    level_labels:
      standard: "常规"
      automotive: "常规(车规)"
      extreme: "极限"

    # ---------- 常规 ----------
    standard:
      panel:
        max_working_panel:   { value: [720, 610], unit: mm, note: "针对通孔板，HDI需评估" }
        max_array:           { value: [500, 500], unit: mm, note: "超过350mm需评估光学点涨缩要求" }
        min_pcs:             { value: [10, 10], unit: mm }
        min_breakaway_rail:  { value: 4, unit: mm }
      stackup:
        core_min:            { value: 0.075, unit: mm }
        pp_options: ["106", "1080", "2116", "7628"]
        impedance_match_tol: { value: 0.1 }
        copper_standard:     { value: "IPC 2级" }
      hole_copper:             # 孔铜厚度
        class1: { value: 18, unit: um }
        class2: { value: 20, unit: um }
        class3: { value: 25, unit: um }
      trace:
        # 最小线宽/线距 L/S (um) 按成品铜厚 T(um) 分档, 单值代表线宽=线距
        min_line_spacing_by_copper:
          - { copper_max_um: 25,  line_um: 40,  space_um: 40 }
          - { copper_min_um: 25,  copper_max_um: 35,  line_um: 50,  space_um: 50 }
          - { copper_min_um: 35,  copper_max_um: 52,  line_um: 70,  space_um: 70 }
          - { copper_min_um: 52,  copper_max_um: 70,  line_um: 85,  space_um: 85 }
          - { copper_min_um: 70,  copper_max_um: 87,  line_um: 110, space_um: 110 }
          - { copper_min_um: 87,  copper_max_um: 105, line_um: 140, space_um: 140 }
        line_width_tolerance:
          - { width_min_um: 50,  width_max_um: 75,  tol_um: 25, note: "设计值±25um" }
          - { width_min_um: 75,  width_max_um: 100, tol_pct: 20, note: "设计值±20%" }
          - { width_min_um: 100, width_max_um: 150, tol_pct: 20, note: "设计值±20%" }
          - { width_min_um: 150, tol_um: 50, note: "设计值±50um" }
        hole_to_hole_spacing:   # 不同网络孔壁间距
          pth_to_pth:       { value: 0.35, unit: mm, note: "根据AR和铜厚对应的线距来定" }
          pth_to_blind:     { value: 0.275, unit: mm }
          blind_to_blind:   { value: 0.25, unit: mm }
        trace_to_board_edge:  { inner: 0.2, outer: 0.2, unit: mm, note: "原表200um" }
        smt_pad_position_tol:   # SMT焊盘公差 (um, 按完成铜厚T / 焊盘尺寸)
          - { pad_max_um: 200, pad_shape: round,  copper_max_um: 44, tol_um: 105 }
          - { pad_max_um: 200, pad_shape: round,  copper_min_um: 44, copper_max_um: 55, tol_um: 140 }
          - { pad_max_um: 200, pad_shape: round,  copper_min_um: 55, tol_um: 160, note: "原表＞160um" }
          - { pad_max_um: 200, pad_shape: rect,   copper_max_um: 44, tol_um: 95 }
          - { pad_max_um: 200, pad_shape: rect,   copper_min_um: 44, copper_max_um: 55, tol_um: 130 }
          - { pad_max_um: 200, pad_shape: rect,   copper_min_um: 55, tol_um: 150, note: "原表＞150um" }
          - { pad_min_um: 200, pad_shape: round,  copper_max_um: 44, tol_um: 105 }
          - { pad_min_um: 200, pad_shape: round,  copper_min_um: 44, copper_max_um: 55, tol_um: 140 }
          - { pad_min_um: 200, pad_shape: round,  copper_min_um: 55, tol_um: 160, note: "原表＞160um" }
          - { pad_min_um: 200, pad_shape: rect,   copper_max_um: 44, tol_um: 95 }
          - { pad_min_um: 200, pad_shape: rect,   copper_min_um: 44, copper_max_um: 55, tol_um: 130 }
          - { pad_min_um: 200, pad_shape: rect,   copper_min_um: 55, tol_um: 150, note: "原表＞150um" }
        aoi_min_detect: { value: 1.57, unit: mil, note: "断路,短路,缺口,针孔" }
      lamination:
        dielectric_thickness_tol: { value: "0.1", note: "原表未注明单位" }
        layer_registration: { value: 0.1, unit: mm, note: "层间压合对位公差(整体)" }
        press_squeeze:      { value: 400, unit: um, note: "硬压接处溢胶量" }
        board_thickness:    { min_mm: 0.4, max_mm: 6.5, note: "板厚(SM/AU/CU)" }
      impedance:
        tolerance_ge_50ohm: { value: 0.1, note: ">=50 Ohm各档位均为0.1" }
        tolerance_lt_50ohm: { value: 5, unit: ohm, note: "±5ohm" }
      drill:
        min_mech_drill:    { value: 0.15, unit: mm }
        max_mech_drill:    { value: 6, unit: mm }
        laser_registration: { value: 15, unit: um }
        min_laser_via:     { value: 75, unit: um, note: "laser通孔" }
        min_laser_blind:   { value: 65, unit: um, note: "laser盲孔" }
        laser_dielectric_limit:
          - { hole_um: null, dielectric_range_um: [50, 100], note: "Laser钻孔对应介质厚度50-100um" }
        annular_ring_mech:  { value: 0.125, unit: mm }
        annular_ring_laser: { value: 0.1, unit: mm }
        pth_drill_tol:  { round_mm: 0.075, note: "±0.075mm" }
        npth_drill_tol: { round_mm: 0.05, note: "±0.05mm" }
        hole_wall_roughness: { value: 25, unit: um }
        hole_position_tol:
          - { tol_mm: 0.075, note: "±0.075mm" }
        npth_to_edge: { value: 0.2, unit: mm, note: "孔壁到板边" }
        via_drill_tol: { value: 0.075, unit: mm, note: "Via孔管控公差(≤0.7mm, 28mil)" }
      plating:
        blind_via_fill_aspect:   { value: 0.8, unit: ratio, note: "镭射盲孔填孔纵横比" }
        blind_via_fill_rate:     { value: 1, unit: ratio, note: "原表值为1(满填)" }
        blind_via_fill_dimple:   { value: 15, unit: um, note: "盲孔填孔凹陷≤15um" }
        plating_uniformity:      { value: 5, unit: um, note: "±5um" }
        pth_aspect_ratio:        { value: 1, unit: ratio, note: "原表1:1，数据存疑请与板厂确认" }
        dimple_bump_inner:       { value: 15, unit: um }
        dimple_bump_outer:       { value: 15, unit: um }
      plug_hole:
        ink_types: ["PSR 2000 CD11B", "R-500BL", "R-500F12", "R-500 F41", "PSR-4000PF10W"]
        soldermask_plug_min:  { board_thickness_mm: 0.4, hole_mm: 0.2 }
        resin_plug_min:       { board_thickness_mm: null, hole_mm: null, note: "原表未提供" }
        ink_plug_depth:       { value: 70, unit: percent, note: "油墨塞孔全塞深度≥70%" }
        resin_plug_depth:     { value: 1, unit: ratio, note: "真空树脂塞孔生产1:20" }
        resin_plug_cap_copper: { value: 5, unit: um, note: "盖铜厚度≥5um" }
        plug_colors: [绿色, 黑色, 黄色, 白色, 蓝色]
        plug_aspect_ratio:    { value: 10, unit: ratio, note: "考虑电镀纵横比因素" }
        plug_alignment:       { value: 2, unit: mil }
      solder_mask:
        ink_thickness: { value: 20, unit: um, note: "阻焊油墨厚度(各铜厚)" }
        min_bridge_single: { value: 100, unit: um, note: "最小阻焊桥(常规/车规)" }
        min_opening:         { value: 0.025, unit: mm }
        opening_tolerance:   { value: 10, unit: um }
      silkscreen:
        min_line_width:      { value: 4, unit: mil }
        min_clearance:       { value: 4, unit: mil }
        min_to_solder_mask:  { value: 4, unit: mil }
        min_char_size:       { width_mil: 19.69, height_mil: 16.51, note: "搭配线宽4mil或5mil" }
        min_to_outline:      { value: 4, unit: mil }
        ink_max_thickness:   { value: 1, unit: mil }
        ink_min_thickness:   { value: 0.39, unit: mil }
      surface_finish:
        ENIG:      { gold_um: [0.025, 0.1], nickel_um: [3, 8] }
        hard_gold: { gold_um: [0.076, 3.5], nickel_um: [3, null], note: "Ni≥3um" }
        ENEPIG:    { gold_um: [0.03, 0.1], palladium_um: [0.05, 0.3], nickel_um: [3, 8] }
        OSP:       { film_um: [0.12, 0.35], note: "F2:0.2-0.35um; F3:0.12-0.25um" }
        immersion_tin: { film_um: [0.8, 1.3] }
      test:
        min_pad: { value: 0.2, unit: mm, note: "普通电测最小PAD" }
        shipping_test: true
        reliability_test: true
        shipping_report: true
      tolerance_class: { value: "IPC 2级", note: "图纸未标注公差" }

    # ---------- 常规(车规) ----------
    automotive:
      panel:
        max_working_panel:   { value: [610, 540], unit: mm, note: "针对通孔板，HDI需评估" }
        max_array:           { value: [500, 500], unit: mm }
        min_pcs:             { value: [10, 10], unit: mm }
        min_breakaway_rail:  { value: 5, unit: mm }
      stackup:
        core_min:            { value: 0.1, unit: mm }
        pp_options: ["106", "1080", "2116"]
        impedance_match_tol: { value: 0.1 }
        copper_standard:     { value: "IPC 3级" }
      hole_copper:
        class1: { value: null, unit: um, note: "NA" }
        class2: { value: 20, unit: um }
        class3: { value: 25, unit: um }
      trace:
        min_line_spacing_by_copper:
          - { copper_max_um: 25,  line_um: 40,  space_um: 40 }
          - { copper_min_um: 25,  copper_max_um: 35,  line_um: 50,  space_um: 50 }
          - { copper_min_um: 35,  copper_max_um: 52,  line_um: 70,  space_um: 70 }
          - { copper_min_um: 52,  copper_max_um: 70,  line_um: 85,  space_um: 85 }
          - { copper_min_um: 70,  copper_max_um: 87,  line_um: 110, space_um: 110 }
          - { copper_min_um: 87,  copper_max_um: 105, line_um: 140, space_um: 140 }
        line_width_tolerance:
          - { width_min_um: 50,  width_max_um: 75,  tol_um: 25 }
          - { width_min_um: 75,  width_max_um: 100, tol_pct: 20 }
          - { width_min_um: 100, width_max_um: 150, tol_pct: 20 }
          - { width_min_um: 150, tol_um: 50 }
        hole_to_hole_spacing:
          pth_to_pth:       { value: 0.4, unit: mm }
          pth_to_blind:     { value: 0.3, unit: mm }
          blind_to_blind:   { value: 0.3, unit: mm }
        trace_to_board_edge:  { inner: 0.2, outer: 0.2, unit: mm }
        smt_pad_position_tol:
          - { pad_max_um: 200, pad_shape: round,  copper_max_um: 44, tol_um: 105 }
          - { pad_max_um: 200, pad_shape: round,  copper_min_um: 44, copper_max_um: 55, tol_um: 140 }
          - { pad_max_um: 200, pad_shape: round,  copper_min_um: 55, tol_um: 160, note: "原表＞160um" }
          - { pad_max_um: 200, pad_shape: rect,   copper_max_um: 44, tol_um: 95 }
          - { pad_max_um: 200, pad_shape: rect,   copper_min_um: 44, copper_max_um: 55, tol_um: 130 }
          - { pad_max_um: 200, pad_shape: rect,   copper_min_um: 55, tol_um: 150, note: "原表＞150um" }
          - { pad_min_um: 200, pad_shape: round,  copper_max_um: 44, tol_um: 105 }
          - { pad_min_um: 200, pad_shape: round,  copper_min_um: 44, copper_max_um: 55, tol_um: 140 }
          - { pad_min_um: 200, pad_shape: round,  copper_min_um: 55, tol_um: 160, note: "原表＞160um" }
          - { pad_min_um: 200, pad_shape: rect,   copper_max_um: 44, tol_um: 95 }
          - { pad_min_um: 200, pad_shape: rect,   copper_min_um: 44, copper_max_um: 55, tol_um: 130 }
          - { pad_min_um: 200, pad_shape: rect,   copper_min_um: 55, tol_um: 150, note: "原表＞150um" }
        aoi_min_detect: { value: 1.57, unit: mil }
      lamination:
        dielectric_thickness_tol: { value: "0.1" }
        layer_registration: { value: 0.1, unit: mm }
        press_squeeze:      { value: 400, unit: um }
        board_thickness:    { min_mm: 0.4, max_mm: 6.5 }
      impedance:
        tolerance_ge_50ohm: { value: 0.1 }
        tolerance_lt_50ohm: { value: 5, unit: ohm }
      drill:
        min_mech_drill:    { value: 0.15, unit: mm }
        max_mech_drill:    { value: 6, unit: mm }
        laser_registration: { value: 15, unit: um }
        min_laser_via:     { value: 75, unit: um }
        min_laser_blind:   { value: 65, unit: um }
        laser_dielectric_limit:
          - { hole_um: null, dielectric_range_um: [50, 100] }
        annular_ring_mech:  { value: 0.125, unit: mm }
        annular_ring_laser: { value: 0.1, unit: mm }
        pth_drill_tol:  { round_mm: 0.075 }
        npth_drill_tol: { round_mm: 0.05 }
        hole_wall_roughness: { value: 25, unit: um }
        hole_position_tol:
          - { tol_mm: 0.075 }
        npth_to_edge: { value: 0.2, unit: mm }
        via_drill_tol: { value: 0.075, unit: mm }
      plating:
        blind_via_fill_aspect:   { value: 1.0, unit: ratio }
        blind_via_fill_rate:     { value: 1, unit: ratio, note: "原表值为1(满填)" }
        blind_via_fill_dimple:   { value: 15, unit: um }
        plating_uniformity:      { value: 5, unit: um }
        pth_aspect_ratio:        { value: 1, unit: ratio, note: "原表1:1，数据存疑请与板厂确认" }
        dimple_bump_inner:       { value: 15, unit: um }
        dimple_bump_outer:       { value: 15, unit: um }
      plug_hole:
        ink_types: ["PSR 2000 CD11B", "R-500BL", "R-500F12", "R-500 F41", "PSR-4000PF10W"]
        soldermask_plug_min:  { board_thickness_mm: 0.4, hole_mm: 0.2 }
        resin_plug_min:       { board_thickness_mm: null, hole_mm: null, note: "原表未提供" }
        ink_plug_depth:       { value: 70, unit: percent }
        resin_plug_depth:     { value: 1, unit: ratio }
        resin_plug_cap_copper: { value: 5, unit: um }
        plug_colors: [绿色, 黑色, 黄色, 白色, 蓝色]
        plug_aspect_ratio:    { value: 10, unit: ratio }
        plug_alignment:       { value: 2, unit: mil }
      solder_mask:
        ink_thickness: { value: 20, unit: um }
        min_bridge_single: { value: 100, unit: um }
        min_opening:         { value: 0.05, unit: mm }
        opening_tolerance:   { value: 10, unit: um }
      silkscreen:
        min_line_width:      { value: 4, unit: mil }
        min_clearance:       { value: 4, unit: mil }
        min_to_solder_mask:  { value: 4, unit: mil }
        min_char_size:       { width_mil: 19.69, height_mil: 16.51 }
        min_to_outline:      { value: 4, unit: mil }
        ink_max_thickness:   { value: 1, unit: mil }
        ink_min_thickness:   { value: 0.39, unit: mil }
      surface_finish:
        ENIG:      { gold_um: [0.025, 0.1], nickel_um: [3, 8] }
        hard_gold: { gold_um: [0.076, 3.5], nickel_um: [3, null] }
        ENEPIG:    { gold_um: [0.03, 0.1], palladium_um: [0.05, 0.3], nickel_um: [3, 8] }
        OSP:       { film_um: [0.12, 0.35] }
        immersion_tin: { film_um: [0.8, 1.3] }
      test:
        min_pad: { value: 0.3, unit: mm }
        shipping_test: true
        reliability_test: true
        shipping_report: true
      tolerance_class: { value: "IPC 3级" }

    # ---------- 极限 ----------
    extreme:
      panel:
        max_working_panel:   { value: [1220, 720], unit: mm, note: "针对通孔板，HDI需评估" }
        max_array:           { value: [500, 500], unit: mm }
        min_pcs:             { value: [10, 10], unit: mm }
        min_breakaway_rail:  { value: 3.5, unit: mm }
      stackup:
        core_min:            { value: 0.05, unit: mm }
        pp_options: ["1027", "1017", "106", "1080", "2116"]
        impedance_match_tol: { value: 0.075 }
        copper_standard:     { value: "IPC 3级" }
      hole_copper:
        class1: { value: 18, unit: um }
        class2: { value: 20, unit: um }
        class3: { value: 25, unit: um }
      trace:
        min_line_spacing_by_copper:
          - { copper_max_um: 25,  line_um: 40,  space_um: 40 }
          - { copper_min_um: 25,  copper_max_um: 35,  line_um: 50,  space_um: 50 }
          - { copper_min_um: 35,  copper_max_um: 52,  line_um: 70,  space_um: 70 }
          - { copper_min_um: 52,  copper_max_um: 70,  line_um: 85,  space_um: 85 }
          - { copper_min_um: 70,  copper_max_um: 87,  line_um: 110, space_um: 110 }
          - { copper_min_um: 87,  copper_max_um: 105, line_um: 140, space_um: 140 }
        line_width_tolerance:
          - { width_min_um: 50,  width_max_um: 75,  tol_um: 25 }
          - { width_min_um: 75,  width_max_um: 100, tol_pct: 20 }
          - { width_min_um: 100, width_max_um: 150, tol_pct: 20 }
          - { width_min_um: 150, tol_um: 50 }
        hole_to_hole_spacing:
          pth_to_pth:       { value: 0.4, unit: mm }
          pth_to_blind:     { value: 0.25, unit: mm }
          blind_to_blind:   { value: 0.225, unit: mm }
        trace_to_board_edge:  { inner: 0.2, outer: 0.2, unit: mm }
        smt_pad_position_tol:
          - { pad_max_um: 200, pad_shape: round,  copper_max_um: 44, tol_um: 95 }
          - { pad_max_um: 200, pad_shape: round,  copper_min_um: 44, copper_max_um: 55, tol_um: 130 }
          - { pad_max_um: 200, pad_shape: round,  copper_min_um: 55, tol_um: 150, note: "原表＞150um" }
          - { pad_max_um: 200, pad_shape: rect,   copper_max_um: 44, tol_um: 85 }
          - { pad_max_um: 200, pad_shape: rect,   copper_min_um: 44, copper_max_um: 55, tol_um: 120 }
          - { pad_max_um: 200, pad_shape: rect,   copper_min_um: 55, tol_um: 140, note: "原表＞140um" }
          - { pad_min_um: 200, pad_shape: round,  copper_max_um: 44, tol_um: 95 }
          - { pad_min_um: 200, pad_shape: round,  copper_min_um: 44, copper_max_um: 55, tol_um: 130 }
          - { pad_min_um: 200, pad_shape: round,  copper_min_um: 55, tol_um: 150, note: "原表＞150um" }
          - { pad_min_um: 200, pad_shape: rect,   copper_max_um: 44, tol_um: 85 }
          - { pad_min_um: 200, pad_shape: rect,   copper_min_um: 44, copper_max_um: 55, tol_um: 120 }
          - { pad_min_um: 200, pad_shape: rect,   copper_min_um: 55, tol_um: 140, note: "原表＞140um" }
        aoi_min_detect: { value: 1.37, unit: mil }
      lamination:
        dielectric_thickness_tol: { value: "0.08" }
        layer_registration: { value: 0.1, unit: mm }
        press_squeeze:      { value: 300, unit: um }
        board_thickness:    { min_mm: 0.4, max_mm: 6.5 }
      impedance:
        tolerance_ge_50ohm: { value: 0.1 }
        tolerance_lt_50ohm: { value: 5, unit: ohm }
      drill:
        min_mech_drill:    { value: 0.15, unit: mm }
        max_mech_drill:    { value: 6, unit: mm }
        laser_registration: { value: 15, unit: um }
        min_laser_via:     { value: 75, unit: um }
        min_laser_blind:   { value: 65, unit: um }
        laser_dielectric_limit:
          - { hole_um: null, dielectric_range_um: [50, 100] }
        annular_ring_mech:  { value: 0.1, unit: mm }
        annular_ring_laser: { value: 0.05, unit: mm }
        pth_drill_tol:  { round_mm: 0.05 }
        npth_drill_tol: { round_mm: 0.025 }
        hole_wall_roughness: { value: 20, unit: um }
        hole_position_tol:
          - { tol_mm: 0.05 }
        npth_to_edge: { value: 0.2, unit: mm }
        via_drill_tol: { value: 0.05, unit: mm }
      plating:
